<!-- Full bleed for Android's adaptive launcher masks. The drawing stays inside
     the safe zone (the centred circle of 80 % diameter, radius 12.8 from
     (16, 16)): the pen mark's far edge, (27.6, 16), is 11.6 away, the trace's
     start (5.5, 16) 10.5 and its peaks under 8. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect width="32" height="32" fill="#141613"/>
  <path d="M5.5 16h3.6l2.4-6.2 3.7 12.4 2.9-8.4 1.7 2.2H22" fill="none" stroke="#f2eee4" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="25.2" cy="16" r="2.4" fill="#8ea2ff"/>
</svg>
