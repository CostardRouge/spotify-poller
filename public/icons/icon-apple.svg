<!-- Full bleed, no rounded corners: iOS applies its own mask and composites a
     transparent pixel onto black, so the tile's corners must be paint. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect width="32" height="32" fill="#141613"/>
  <path d="M5.5 16h3.6l2.4-6.2 3.7 12.4 2.9-8.4 1.7 2.2H22" fill="none" stroke="#f2eee4" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="25.2" cy="16" r="2.4" fill="#8ea2ff"/>
</svg>
