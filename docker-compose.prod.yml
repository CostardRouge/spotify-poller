# Home Lab stack (Dell OptiPlex) — optimized image with healthcheck.
# Image is built & published by .github/workflows/docker-build.yml on every
# push to main, so this pulls from GHCR instead of building locally.
# If the GitHub repo/package is private, run once on the host:
#   docker login ghcr.io -u <github-username> -p <PAT with read:packages>
# Usage: make prod-pull && make prod-up
services:
  spotify-poller:
    image: ghcr.io/costardrouge/spotify-poller:latest
    container_name: spotify-poller
    ports:
      # Debug UI + admin API: keep them on the local network (no direct
      # internet exposure — TLS reverse proxy if remote access is needed).
      - "${APP_PORT:-8787}:8787"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - API_HOST=0.0.0.0
      - DB_PATH=/data/life-events.db
      # Container-internal scheduling — decision documented in
      # docs/scheduling.md. 'played' every 30 min, 'liked' daily.
      - SCHEDULE_ENABLED=1
      # Daily .db snapshot onto the host bind mount below.
      - BACKUP_ENABLED=${BACKUP_ENABLED:-1}
      - BACKUP_DIR=/backups
    volumes:
      # The SQLite database is IRREPLACEABLE (spec §1): a named volume is
      # mandatory, never the container's writable layer. Include it in backups.
      - spotify-poller-data:/data
      # Backups live on the HOST filesystem, deliberately outside the data
      # volume: a snapshot stored inside the volume it protects is not a backup.
      # These files contain the Spotify refresh token — keep them as private
      # as .env, and include them in the host's off-site backups.
      - ./backups:/backups
    restart: unless-stopped
    healthcheck:
      test:
        ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8787/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  spotify-poller-data:
