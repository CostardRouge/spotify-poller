# Home Lab stack (Dell OptiPlex) — optimized image with healthcheck.
# Image is built & published by .github/workflows/docker-build.yml on every
# push to main, so this pulls from GHCR instead of building locally.
# If the GitHub repo/package is private, run once on the host:
#   docker login ghcr.io -u <github-username> -p <PAT with read:packages>
# Usage: make prod-pull && make prod-up
services:
  temoin:
    image: ghcr.io/costardrouge/temoin:latest
    container_name: temoin
    ports:
      # Dashboard + admin API: keep them on the local network (no direct
      # internet exposure — TLS reverse proxy if remote access is needed).
      - "${APP_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - API_HOST=0.0.0.0
      - DB_PATH=/data/life-events.db
      # Container-internal scheduling — decision documented in
      # docs/scheduling.md. 'played' every 30 min, 'liked' daily.
      - SCHEDULE_ENABLED=1
      # Daily .db snapshot onto the host bind mount below.
      - BACKUP_ENABLED=${BACKUP_ENABLED:-1}
      - BACKUP_DIR=/backups
    volumes:
      # The SQLite database is IRREPLACEABLE (spec §1): a named volume is
      # mandatory, never the container's writable layer. Include it in backups.
      # It keeps the project's old name on purpose (see the volumes block).
      - spotify-poller-data:/data
      # Backups live on the HOST filesystem, deliberately outside the data
      # volume: a snapshot stored inside the volume it protects is not a backup.
      # These files contain the Spotify refresh token — keep them as private
      # as .env, and include them in the host's off-site backups.
      - ./backups:/backups
    restart: unless-stopped
    # Kept identical to the Dockerfile HEALTHCHECK (compose overrides it): a
    # single-instance origin must not be evicted from the reverse proxy over a
    # brief stall — eviction IS the 502/404 outage. 10 s per probe, ~2.5 min of
    # consecutive failures before unhealthy; real deaths still fail instantly.
    healthcheck:
      test:
        ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  # NEVER rename this volume, nor give it a new `name:`. Docker cannot rename a
  # volume: a new name is a new, EMPTY volume, and the container would start
  # collecting into a fresh database while the irreplaceable history sat unused
  # in the old one. The project became Témoin on 2026-11-27; the data kept the
  # name it was created under (docs/memory/deployment.md, "The rename to Témoin").
  # Compose prefixes it with the project name, i.e. the checkout's folder, which
  # is why the Makefile and docs/backup.md say spotify-poller_spotify-poller-data:
  # a checkout cloned into a folder called `temoin` would get
  # temoin_spotify-poller-data instead — clone into `spotify-poller`, or run
  # with `-p spotify-poller`, to keep the existing volume.
  spotify-poller-data:
