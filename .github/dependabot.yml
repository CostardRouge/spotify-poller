# Dependabot, the portfolio's shape (COMMON-PROJECT-SPEC.md, C20), trimmed
# to what this repository has: one package.json at the root, two Dockerfiles
# at the root, GitHub Actions. No docker-compose block: the only image a
# compose file names is this repository's own (ghcr.io/…:latest).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
      semver-major-days: 30
    open-pull-requests-limit: 3
    groups:
      # Families that only work in step: a major moves the whole family.
      # Listed first, since a dependency goes to the first group it matches —
      # which is also why `next` comes before `eslint`: eslint-config-next
      # matches both and must move with Next.
      react:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
        update-types: [major]
      next:
        patterns: ['next', 'eslint-config-next', '@next/*']
        update-types: [major]
      eslint:
        patterns: ['eslint', '@eslint/*', 'typescript-eslint', '@typescript-eslint/*', 'eslint-plugin-*', 'eslint-config-*']
        update-types: [major]
      tailwind:
        patterns: ['tailwindcss', '@tailwindcss/*']
        update-types: [major]
      # Every minor and patch, production and development together:
      # one pull request a month. react and react-dom pin each other's exact
      # version as a peer, so a minor of one alone fails `npm ci` — here they
      # always travel together.
      minor-and-patch:
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        patterns: ['*']
    ignore:
      # Node's type definitions follow .nvmrc's major (C14).
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # ESLint 10 cannot run under eslint-config-next 16: measured here on
      # 2026-10-21, eslint 10.13.0 aborts every file with "scopeManager.
      # addGlobals is not a function" (the plugins and parser Next bundles
      # predate it). Lift this when an eslint-config-next release declares
      # eslint 10 in its peer range — docs/memory/deployment.md.
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    ignore:
      # Held outright, not only across a major: 24.19.0 and later abort
      # better-sqlite3 at random (nodejs/node#63642 — CLAUDE.md, Other rules),
      # so even a bot's patch bump would ship that crash to production again.
      # The image is raised by hand, with .nvmrc and both Dockerfiles together,
      # once that issue is fixed in the target release; a new major also
      # brings CI and @types/node in the same PR (C14).
      - dependency-name: 'node'
