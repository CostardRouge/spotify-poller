<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!--
    The link-preview card (OpenGraph / Twitter, 1200 × 630), rasterised to public/og.png by
    scripts/gen-icons.mjs. The Témoin look (2026-11-27): the paper, the ink, the blue pen. The strip on
    the right is a drawing of the trace, not data: a preview is shown to whoever a link is sent to, so it
    carries no number, no track and no account, and no green either, since green means healthy and a
    drawing cannot know that. The dashed amber stretch is how a declared gap is drawn in the app.
  -->
  <rect width="1200" height="630" fill="#f2eee4"/>

  <g transform="translate(80 80) scale(2.75)">
    <rect width="32" height="32" rx="7" fill="#141613"/>
    <path d="M5.5 16h3.6l2.4-6.2 3.7 12.4 2.9-8.4 1.7 2.2H22" fill="none" stroke="#f2eee4" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="25.2" cy="16" r="2.4" fill="#8ea2ff"/>
  </g>

  <g font-family="Inter Tight, Inter, ui-sans-serif, system-ui, sans-serif">
    <text x="80" y="290" font-size="96" font-weight="700" letter-spacing="-3.5" fill="#141613">témoin</text>
    <text x="80" y="350" font-size="32" fill="#4b4a42">A custody report for a personal</text>
    <text x="80" y="392" font-size="32" fill="#4b4a42">Spotify listening history.</text>
  </g>
  <text x="80" y="550" font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="22" fill="#4b4a42">Self-hosted · Next.js · SQLite · MIT</text>

  <g transform="translate(650 150)">
    <rect x="0.5" y="0.5" width="469" height="329" rx="22" fill="#fbf9f4" stroke="#e2dccd"/>
    <g font-family="IBM Plex Mono, DejaVu Sans Mono, monospace" font-size="15" fill="#4b4a42">
      <text x="28" y="44">00</text><text x="141" y="44">06</text><text x="254" y="44">12</text><text x="367" y="44">18</text><text x="440" y="44">24</text>
    </g>
    <g stroke="#e2dccd"><line x1="0" y1="96" x2="470" y2="96"/><line x1="0" y1="176" x2="470" y2="176"/><line x1="0" y1="256" x2="470" y2="256"/></g>
    <g fill="none" stroke="#2340a8" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round">
      <path d="M28 136 H150 l6 -22 l6 22 l6 18 l6 -30 l6 30 H230 l5 -14 l5 14 H300 l6 -26 l6 26 l6 20 l6 -32 l6 32 l6 -14 l6 14 H442"/>
      <path d="M28 216 H120 l6 -18 l6 18 H170"/>
      <path d="M262 216 H300 l6 -24 l6 24 l6 16 l6 -28 l6 28 H442"/>
      <path d="M28 296 H200 l6 -20 l6 20 l6 14 l6 -24 l6 24 H330"/>
    </g>
    <path d="M170 216 H262" fill="none" stroke="#b86a00" stroke-width="3" stroke-dasharray="7 7"/>
    <circle cx="330" cy="296" r="9" fill="#2340a8"/>
  </g>
</svg>
